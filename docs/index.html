<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UMD Nutrition</title>
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UMD Food">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
<!--
  Deliberate empty space. Scrolled to the top, this pushes the first item down to
  about mid-screen, so the best-ranked food is in thumb reach instead of up under
  the notch.
-->
<header id="hero">
  <p class="hero-date" id="hero-date">&nbsp;</p>
  <h1 id="hero-where">UMD&nbsp;Nutrition</h1>
  <p class="hero-sub" id="hero-sub">&nbsp;</p>
  <p class="hero-meta" id="hero-meta">&nbsp;</p>
</header>

<main id="list" aria-live="polite"></main>

<div id="toast" hidden></div>

<!-- Full-screen label. White, nothing else on it, so a camera has a clean target. -->
<div id="labelview" hidden></div>

<!-- Fixed bottom stack: plate totals, then the chips closest to the thumb. -->
<div id="dock">
  <button id="plate" hidden></button>
  <header id="bar">
    <div class="crumb" id="crumb">Loading…</div>
  </header>
</div>

<!--
  Classic script, deliberately plain syntax so it parses anywhere. It runs before the
  module and turns a silent failure into something readable on the phone, where there
  is no console.
-->
<script>
window.__stage = 'parsing app.js';
function __report(title, detail) {
  var box = document.getElementById('list');
  if (!box) return;
  box.innerHTML = '<div class="msg"><b>' + title + '</b><br><br>' +
    String(detail).replace(/</g, '&lt;') + '<br><br>stage: ' + window.__stage +
    '<br>ua: ' + String(navigator.userAgent).replace(/</g, '&lt;') + '</div>';
}
window.addEventListener('error', function (e) {
  __report('Script error', (e.message || 'unknown') + '\n' +
    (e.filename || '') + (e.lineno ? ':' + e.lineno + ':' + e.colno : ''));
});
window.addEventListener('unhandledrejection', function (e) {
  __report('Load failed', (e.reason && e.reason.message) || e.reason);
});
setTimeout(function () {
  if (window.__stage !== 'done') __report('Stuck', 'Nothing rendered after 8 seconds.');
}, 8000);
</script>

<script type="module" src="js/app.js"></script>
</body>
</html>
