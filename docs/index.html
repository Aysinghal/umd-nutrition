<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UMD Nutrition</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="bar">
  <div class="crumb" id="crumb">Loading…</div>
</header>

<main id="list" aria-live="polite"></main>

<!--
  Classic script, deliberately plain syntax so it parses anywhere. It runs before the
  module and turns a silent failure into something readable on the phone, where there
  is no console.
-->
<script>
window.__stage = 'parsing app.js';
function __report(title, detail) {
  var box = document.getElementById('list');
  if (!box) return;
  box.innerHTML = '<div class="msg"><b>' + title + '</b><br><br>' +
    String(detail).replace(/</g, '&lt;') + '<br><br>stage: ' + window.__stage +
    '<br>ua: ' + String(navigator.userAgent).replace(/</g, '&lt;') + '</div>';
}
window.addEventListener('error', function (e) {
  __report('Script error', (e.message || 'unknown') + '\n' +
    (e.filename || '') + (e.lineno ? ':' + e.lineno + ':' + e.colno : ''));
});
window.addEventListener('unhandledrejection', function (e) {
  __report('Load failed', (e.reason && e.reason.message) || e.reason);
});
setTimeout(function () {
  if (window.__stage !== 'done') __report('Stuck', 'Nothing rendered after 8 seconds.');
}, 8000);
</script>

<script type="module" src="js/app.js"></script>
</body>
</html>
